[package]
name = "minkowski-py"
version = "1.3.0"
edition = "2024"
publish = false

[lints]
workspace = true

[lib]
name = "_minkowski"
crate-type = ["cdylib"]

[dependencies]
minkowski = { path = "../minkowski" }
pyo3 = { version = "0.29", features = ["extension-module"] }
pyo3-arrow = "0.19"
arrow = { version = "59", default-features = false }
